# Streamlit Cloud Secrets Configuration
# Copy these values to Streamlit Cloud Dashboard: Settings → Secrets
# DO NOT commit this file with real API keys

# AI Provider Configuration - Using Ollama (Local, Free)
AI_PROVIDER = "ollama"
GEMINI_API_KEY = "your-gemini-api-key-here"
OPENAI_API_KEY = "your-openai-api-key-here"

# Model Selection
EVALUATION_MODEL = "llama3.2"
TRANSCRIPTION_MODEL = "base"

# Processing Limits
MAX_FILE_SIZE_MB = 500
MAX_DURATION_SECONDS = 3600
MAX_FRAMES = 12
FRAME_INTERVAL_SECONDS = 30

# Scoring Thresholds
THRESHOLD_POOR_MAX = 39
THRESHOLD_AVERAGE_MAX = 59
THRESHOLD_GOOD_MAX = 79

# Logging
LOG_LEVEL = "INFO"

# Timeout Settings
LLM_TIMEOUT_SECONDS = 600
